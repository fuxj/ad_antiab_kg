name: neuroai
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - networkx
  - pyarrow
  - requests
  - tqdm
  - lifelines
  - openpyxl
  - pip:
      # PyTorch / PyG must match: torch==2.3.1 + torch-geometric==2.5.3
      - torch==2.3.1
      - torch-geometric==2.5.3
      - pyvis
